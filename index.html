    :root {
      --bg: #060a12;
      --bg-elevated: #0b1120;
      --surface: #10192c;
      --surface-2: #16223b;
      --border: #22314e;
      --border-hover: #3b588c;
      --text: #f8fafc;
      --text-secondary: #cbd5e1;
      --muted: #94a3b8;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --accent-soft: rgba(59, 130, 246, 0.14);
      --emerald: #10b981;

      --linkedin: #0a66c2;
      --mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    a { color: inherit; text-decoration: none; }
    code {
      font-family: var(--mono);
      font-size: 0.84em;
      background: rgba(15, 23, 42, 0.85);
      padding: 0.12rem 0.38rem;
      border-radius: 4px;
      border: 1px solid var(--border);
      color: #93c5fd;
    }

    /* Navigation */
    nav {
      background: rgba(6, 10, 18, 0.92);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .nav-inner {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0.8rem 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .brand-mark {
      width: 36px;
      height: 36px;
      border-radius: 9px;
      background: linear-gradient(135deg, var(--accent), var(--emerald));
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 0.88rem;
      color: #fff;
      flex-shrink: 0;
    }

    .brand-text strong {
      display: block;
      font-size: 0.98rem;
      font-weight: 700;
    }

    .brand-text span {
      display: block;
      font-size: 0.72rem;
      color: var(--muted);
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 1.25rem;
      font-size: 0.84rem;
      font-weight: 500;
      color: var(--text-secondary);
    }

    .nav-links a:hover { color: #fff; }

    .nav-live {
      color: #6ee7b7 !important;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
    }

    .pulse-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--emerald);
    }

    .nav-actions {
      display: flex;
      align-items: center;
      gap: 0.55rem;
    }
